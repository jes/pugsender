[package]
name = "pugsender"
version = "0.1.0"
description = "Keyboard-first Grbl/gbrlHAL G-code sender"
authors = ["pugsender contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "pugsender_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
serial = ["dep:serialport"]
desktop = ["serial", "dep:tauri", "dep:tauri-plugin-dialog"]
desktop-test = ["desktop", "tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", optional = true }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
thiserror = "1"

[dev-dependencies]
nix = { version = "0.29", features = ["term", "fs"] }
